[project]
name = "wordle-cli"
version = "0.1.0"
description = "CLI Wordle game"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.86.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/src"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
